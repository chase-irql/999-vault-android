name: verify
on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - run: node scripts/validate-parity.mjs
      - run: ./gradlew clean test testDebugUnitTest lintDebug assembleDebug assembleFixture assembleRelease bundleRelease :benchmark:assemble
      - run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > dependency-report.txt
